name: TimePrice
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  groupSortPosition: top
  createIntermediateGroups: true
  bundleIdPrefix: com.timeprice
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    SWIFT_STRICT_CONCURRENCY: targeted
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_PREVIEWS: YES
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
packages:
  TimePriceCore:
    path: TimePriceCore
targets:
  TimePrice iOS:
    type: application
    platform: iOS
    productName: TimePrice
    sources:
      - path: Apps/Shared
      - path: Apps/iOS
      - path: Extensions/ShieldShared
      - path: Resources
    dependencies:
      - package: TimePriceCore
      - target: TimePrice iOS Safari
        embed: true
      - target: TimePrice Shield Configuration
        embed: true
      - target: TimePrice Shield Action
        embed: true
      - target: TimePrice Device Activity
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timeprice.ios
        PRODUCT_MODULE_NAME: TimePriceiOS
        PRODUCT_NAME: TimePrice
        INFOPLIST_FILE: Config/Info/iOS-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Entitlements/iOS.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    entitlements:
      path: Config/Entitlements/iOS.entitlements
    info:
      path: Config/Info/iOS-Info.plist
  TimePrice Mac:
    type: application
    platform: macOS
    productName: TimePrice
    sources:
      - path: Apps/Shared
      - path: Apps/Mac
      - path: Resources
    dependencies:
      - package: TimePriceCore
      - target: TimePrice Mac Safari
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timeprice.mac
        PRODUCT_MODULE_NAME: TimePriceMac
        PRODUCT_NAME: TimePrice
        SDKROOT: macosx
        INFOPLIST_FILE: Config/Info/Mac-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Entitlements/Mac.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    entitlements:
      path: Config/Entitlements/Mac.entitlements
    info:
      path: Config/Info/Mac-Info.plist
  TimePrice iOS Safari:
    type: app-extension
    platform: iOS
    productName: TimePriceSafari
    sources:
      - path: Extensions/Safari/Sources
      - path: Extensions/Safari/Resources
    dependencies:
      - package: TimePriceCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timeprice.ios.safari
        PRODUCT_MODULE_NAME: TimePriceiOSSafari
        PRODUCT_NAME: TimePriceSafari
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Info/Safari-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Entitlements/Safari-iOS.entitlements
        SKIP_INSTALL: YES
        SUPPORTS_MACCATALYST: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    entitlements:
      path: Config/Entitlements/Safari-iOS.entitlements
    info:
      path: Config/Info/Safari-Info.plist
  TimePrice Mac Safari:
    type: app-extension
    platform: macOS
    productName: TimePriceSafari
    sources:
      - path: Extensions/Safari/Sources
      - path: Extensions/Safari/Resources
    dependencies:
      - package: TimePriceCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timeprice.mac.safari
        PRODUCT_MODULE_NAME: TimePriceMacSafari
        PRODUCT_NAME: TimePriceSafari
        SDKROOT: macosx
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Info/Safari-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Entitlements/Safari-Mac.entitlements
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
    entitlements:
      path: Config/Entitlements/Safari-Mac.entitlements
    info:
      path: Config/Info/Safari-Info.plist
  TimePrice Shield Configuration:
    type: app-extension
    platform: iOS
    productName: TimePriceShieldConfiguration
    sources:
      - path: Extensions/ShieldConfiguration
      - path: Extensions/ShieldShared
    dependencies:
      - package: TimePriceCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timeprice.ios.shield-config
        PRODUCT_MODULE_NAME: TimePriceShieldConfiguration
        PRODUCT_NAME: TimePriceShieldConfiguration
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Info/ShieldConfiguration-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Entitlements/iOS.entitlements
        SKIP_INSTALL: YES
        SUPPORTS_MACCATALYST: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    entitlements:
      path: Config/Entitlements/iOS.entitlements
    info:
      path: Config/Info/ShieldConfiguration-Info.plist
  TimePrice Shield Action:
    type: app-extension
    platform: iOS
    productName: TimePriceShieldAction
    sources:
      - path: Extensions/ShieldAction
      - path: Extensions/ShieldShared
    dependencies:
      - package: TimePriceCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timeprice.ios.shield-action
        PRODUCT_MODULE_NAME: TimePriceShieldAction
        PRODUCT_NAME: TimePriceShieldAction
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Info/ShieldAction-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Entitlements/iOS.entitlements
        SKIP_INSTALL: YES
        SUPPORTS_MACCATALYST: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    entitlements:
      path: Config/Entitlements/iOS.entitlements
    info:
      path: Config/Info/ShieldAction-Info.plist
  TimePrice Device Activity:
    type: app-extension
    platform: iOS
    productName: TimePriceDeviceActivity
    sources:
      - path: Extensions/DeviceActivity
      - path: Extensions/ShieldShared
    dependencies:
      - package: TimePriceCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timeprice.ios.device-activity
        PRODUCT_MODULE_NAME: TimePriceDeviceActivity
        PRODUCT_NAME: TimePriceDeviceActivity
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Info/DeviceActivity-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Entitlements/iOS.entitlements
        SKIP_INSTALL: YES
        SUPPORTS_MACCATALYST: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    entitlements:
      path: Config/Entitlements/iOS.entitlements
    info:
      path: Config/Info/DeviceActivity-Info.plist
schemes:
  TimePrice iOS:
    build:
      targets:
        TimePrice iOS: all
    run:
      config: Debug
  TimePrice Mac:
    build:
      targets:
        TimePrice Mac: all
    run:
      config: Debug
